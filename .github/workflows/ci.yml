name: Compiler validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install meson==1.10.2 ninja==1.13.0
      - name: Build
        run: |
          meson setup build -Dbuildtype=release
          meson compile -C build -j 2
      - name: Test
        run: meson test -C build --num-processes 2 --print-errorlogs
      - name: Report failed suites
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          log = Path('build/meson-logs/testlog.json')
          if log.exists():
              for line in log.read_text().splitlines():
                  suite = json.loads(line)
                  if not suite.get('is_fail'):
                      continue
                  details = '\n'.join([
                      f"{suite['name']}: {suite['result']}",
                      suite.get('stdout', ''),
                      suite.get('stderr', ''),
                  ]).strip()
                  # Workflow commands require escaping literal percent/newlines.
                  details = details.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error::{details}')
          PY
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.cc }}
          path: build/meson-logs/
